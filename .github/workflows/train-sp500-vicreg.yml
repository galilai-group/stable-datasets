
name: Train SP500 VICReg

on:
  push:
    branches:
      - add-financial-timeseries-datasets
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install numpy pandas kagglehub scikit-learn
          pip install git+https://github.com/galilai-group/stable-pretraining.git

      - name: Train and evaluate VICReg
        run: python examples/train_sp500_vicreg.py
