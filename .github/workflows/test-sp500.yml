name: Test SP500 dataset

on:
  push:
    branches:
      - add-financial-timeseries-datasets
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy pandas kagglehub huggingface_hub pyarrow

      - name: Test financial datasets
        run: python -m pytest stable_datasets/tests/test_sp500.py stable_datasets/tests/test_forex.py -v

      - name: Test real Forex dataset download
        run: |
          python - <<'PY'
          import numpy as np
          from stable_datasets.timeseries import Forex
      
          for split in ["train", "validation", "test"]:
              dataset = Forex(split=split).with_format("numpy")
      
              print(f"{split}: {len(dataset)} windows")
      
              assert len(dataset) > 0, f"Empty {split} split"
      
              example = np.asarray(dataset[0]["series"], dtype=np.float32)
              assert example.shape == (30, 4)
              assert np.isfinite(example).all()
      
          print("Real Forex dataset loaded successfully!")
          PY
