name: build_sphinx_docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # A new push to a PR cancels that PR's previous run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # - name: Remove all .rst files except index.rst
      #   run: |
      #     find docs/source -type f -name "*.rst" ! -name "index.rst" -exec rm -f {} \;

      # The excluded modules are legacy load() scripts that import helpers which no longer
      # exist, so autodoc can't import them. Drop an entry once its module is ported or deleted.
      - name: Generate .rst files from package
        run: |
          sphinx-apidoc -o docs/source stable_datasets \
            stable_datasets/timeseries/birdvox_70k.py \
            stable_datasets/timeseries/dcase_2019_task4.py \
            stable_datasets/timeseries/esc.py \
            stable_datasets/timeseries/irmas.py \
            stable_datasets/timeseries/TUTacousticscenes2017.py \
            stable_datasets/timeseries/UCR_multivariate.py \
            stable_datasets/timeseries/UCR_univariate.py

      # -W fails the build on any warning; --keep-going reports them all before failing.
      - name: Build Sphinx HTML documentation
        run: |
          cd docs
          sphinx-build -W --keep-going -b dirhtml source/ build/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/build/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/
