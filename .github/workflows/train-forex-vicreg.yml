
name: Train Forex VICReg

on:
  push:
    branches:
      - add-financial-timeseries-datasets
    paths:
      - "examples/train_forex_vicreg.py"
      - ".github/workflows/train-forex-vicreg.yml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install numpy pandas kagglehub huggingface_hub pyarrow scikit-learn
          pip install git+https://github.com/galilai-group/stable-pretraining.git

      - name: Train and evaluate Forex VICReg
        run: python examples/train_forex_vicreg.py
