[build-system]
requires = ["setuptools>=70.1", "setuptools-scm"]  # 70.1: setuptools.command.bdist_wheel (setup.py)
build-backend = "setuptools.build_meta"

[project]
name = "stable-datasets"
description = "All dataset utilities in Numpy"
authors = [
    {name = "Randall Balestriero"},
]
requires-python = ">=3.10"
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = [
    "numpy>=1.22",
    "loguru",
    "pyarrow>=14",
    "pylance",  # every cache is a Lance dataset
    "tqdm",
    "pillow",
    "pandas",
    "rich",
    "filelock",
    "requests",
    "gdown",
    "scikit-learn",
    "scipy",
    "rarfile",
    "h5py",
]

dynamic = ["version"]

[tool.setuptools]
packages = { find = { include = ["stable_datasets*"] } }

[tool.setuptools.package-data]
"stable_datasets.framestore" = ["csrc/*.c"]

[tool.setuptools.dynamic]
version = {attr = "stable_datasets.__version__"}

[project.optional-dependencies]

# PyTorch DataLoader integration, samplers and torch output formats
torch = ["torch"]

# Video decoding and Video(storage="frames") caches
video = ["opencv-python-headless", "torch", "torchcodec"]

# JPEG frame stores with partial decoding (stable_datasets.framestore); the GPU loaders need torchvision with CUDA
framestore = ["numba", "simplejpeg", "torchvision"]

# Benchmark dependencies (profiling + SSL evaluation suite)
benchmarks = [
    "psutil",
    "datasets",
    "torchvision",
    # Pinned because upstream renames APIs between patch releases; Dependabot opens a PR for each new release.
    "stable-pretraining==0.1.8",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "hydra-joblib-launcher>=1.2",
    "omegaconf>=2.3",
    "tabulate",
]

# Development tools. The tests also need every optional runtime extra.
dev = [
    "stable-datasets[all]",
    "pytest",
    "coverage",
    "pytest-cov",
    "pytest-rich",
    "pytest-split",
    "hypothesis",  # framestore's fuzz and property tests
    "codecov",
    "pre-commit",
    "ruff",
    "transformers",
    "wandb",
]

# Documentation tools
docs = [
    "sphinx",
    "sphinxawesome-theme",
    "sphinx-gallery",
    "sphinx-book-theme",
    "matplotlib",
    "memory_profiler",
    "sphinx_design",
    "myst-parser",
]

all = [
    "stable-datasets[torch,video]",
]

# =======================
#         TOOLS
# =======================

###################
## Pytest config ##
###################

[tool.pytest.ini_options]
testpaths = ["stable_datasets/tests"]

# Test discovery patterns
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Fail on unknown markers, so a typo like `@pytest.mark.larg` can't silently run a huge download in CI.
addopts = "--strict-markers"

# Custom markers
markers = [
    "large: downloads more than ~10 GB, so it never runs in CI; run it by hand before merging",
]

#####################
## Coverage config ##
#####################

[tool.coverage.run]
source = ["stable_datasets"]
omit = [
    "*/tests/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@runtime_checkable",
    "class .*Protocol",
    "raise",
    "except",
    "register_parameter"
]

#################
## Ruff config ##
#################

# NOTE: borrowed and adapted from: huggingface/transformers

[tool.ruff]
target-version = "py310"
line-length = 119
fix = true

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
# SIM300: Yoda condition detected
# SIM212: Checks for if expressions that check against a negated condition.
# SIM905: Consider using a list literal instead of `str.split`
# UP009: UTF-8 encoding declaration is unnecessary
# UP015: Unnecessary mode argument
# UP031: Use format specifiers instead of percent format
# UP004: Class `XXX` inherits from `object`
# UP028: Checks for for loops that can be replaced with yield from expressions
# UP045: Use `X | None` for type annotations
# UP007: Use `X | Y` for type annotations
# UP035: temporarily disabled to minimize upgrade changes
ignore = ["C901", "E501", "E741", "F402", "F823", "SIM1", "SIM300", "SIM212", "SIM905", "UP009", "UP015", "UP031", "UP028", "UP004", "UP045", "UP007", "UP035"]
# RUF013: Checks for the use of implicit Optional
#  in type annotations when the default parameter value is None.
# D101/D102/D103: public classes, methods and functions need a docstring (dataset builders only, see below).
select = ["C", "E", "F", "I", "W", "RUF013", "PERF102", "PLC1802", "PLC0208", "SIM", "UP", "D101", "D102", "D103"]
extend-safe-fixes = ["UP006"]

[tool.ruff.lint.per-file-ignores]
# Only dataset builders are required to have docstrings for now.
"!stable_datasets/{images,timeseries,video,tabular}/*.py" = ["D101", "D102", "D103"]
# Stubs that open PRs replace with documented builders (#88, #40); drop these once they merge.
"stable_datasets/images/patch_camelyon.py" = ["D101"]
"stable_datasets/timeseries/brain_mnist.py" = ["D101"]

# old: config
# select = ["E4", "E7", "E9", "F", "D"]
# ignore = ["D100", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["stable_datasets"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

# Release wheels (.github/workflows/release.yml): framestore's C helpers with libjpeg-turbo linked in statically. They
# do not depend on the Python version (py3-none-<platform>, setup.py), so one interpreter builds each platform's wheel.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
before-all = "bash .github/scripts/build_libjpeg.sh /tmp/libjpeg"
environment = { FRAMESTORE_LIBJPEG = "/tmp/libjpeg", FRAMESTORE_REQUIRE_HELPERS = "1" }

[tool.cibuildwheel.macos]
environment = { FRAMESTORE_LIBJPEG = "/tmp/libjpeg", FRAMESTORE_REQUIRE_HELPERS = "1", MACOSX_DEPLOYMENT_TARGET = "11.0" }
