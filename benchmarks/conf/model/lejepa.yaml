name: lejepa
forward: lejepa_forward

transforms:
  type: multicrop
  num_global: 2
  num_local: 6

# NOTE: deliberately NO drop_path_rate here. spt's LeJEPA defaults to 0.1 and
# the le-wm-collapse reference keeps it, but this benchmark pretrains every
# method at 0.0 (models/vit.py: "finetune uses 0.1, pretrain 0.0"). Enabling it
# for LeJEPA alone would make it the only method with stochastic depth -- an
# uncontrolled difference of exactly the kind the supervised batch-size fix
# removed. The build() plumbing below reads this key if present, so turning it
# on for ALL ViT methods later is a one-line change per model.
# SIGReg hyperparameters, aligned to the LeJEPA paper (arXiv:2511.08544 §6.1)
# rather than to stable_pretraining's library defaults, which differ on two
# counts:
#   lamb  -- spt defaults to 0.02; the paper says "We thus recommend lambda=0.05
#            as a robust default" and repeats it in its starting-point recipe
#            ("lambda=0.05, Vg=2, Vl=8, batch size >=128").
#   t_max -- spt defaults to 3.0. EppsPulley builds t = linspace(0, t_max, n)
#            with doubled interior weights, so t_max IS the half-width of a
#            symmetric domain: 3.0 means [-3,3]. The paper's Table 1a ablates
#            [-1,1] / [-3,3] / [-5,5] and recommends [-5,5].
# n_points=17 and num_slices=1024 already match the paper's recommendation.
loss:
  lamb: 0.05
  t_max: 5.0
  n_points: 17
  num_slices: 1024


params:
  default:
    batch_size: 256
    max_epochs: 63
    # Micro-batch for multicrop. Measured on a 24GB card at the paper's 96px
    # local crops (2x224 + 6x96): bs=128 peaks at 14.5GB, bs=192 at 21.6GB.
    # The previous value of 8 (micro-batch 32, 3.9GB) came from an unrelated
    # video refactor and was never validated for this view shape -- it cited a
    # "22GB 3090", but 3090s are 24GB and we already constrain to those.
    # 2 keeps the EFFECTIVE batch at 256, so the LR stays calibrated, while
    # SIGReg -- a distributional statistic estimated per micro-batch from
    # n_views x bs samples -- goes from 256 samples to 1024, matching the
    # reference implementation exactly.
    accumulate_grad_batches: 2
  # CIFAR-scale (32x32)
  cifar10:
    batch_size: 256
    max_epochs: 250
  cifar100:
    batch_size: 256
    max_epochs: 250
  svhn:
    batch_size: 256
    max_epochs: 188
  # Grayscale 28x28
  fashionmnist:
    batch_size: 256
    max_epochs: 188
  emnist:
    batch_size: 256
    max_epochs: 188
  kmnist:
    batch_size: 256
    max_epochs: 188
  notmnist:
    batch_size: 256
    max_epochs: 250
  pneumoniamnist:
    batch_size: 256
    max_epochs: 250
  # Other small datasets
  arabiccharacters:
    batch_size: 256
    max_epochs: 313
  arabicdigits:
    batch_size: 256
    max_epochs: 313
  # Larger resolution
  stl10:
    batch_size: 256
    max_epochs: 188
  # Small fine-grained
  flowers102:
    batch_size: 256
    max_epochs: 375
  cub200:
    batch_size: 256
    max_epochs: 375
  dtd:
    batch_size: 256
    max_epochs: 375
  country211:
