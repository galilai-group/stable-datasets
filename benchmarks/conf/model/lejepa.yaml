vit_optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  scheduler:
    type: LinearWarmupCosineAnnealing

resnet_optimizer:
  type: AdamW
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  scheduler:
    type: LinearWarmupCosineAnnealing
