name: dino

transforms:
  type: multicrop
  num_global: 2
  num_local: 6

projector:
  hidden_dim: 2048
  bottleneck_dim: 256
  output_dim: 65536

loss:
  temperature_student: 0.1
  # DINO warms the TEACHER temperature up from 0.04 to 0.07 over the first
  # warmup_epochs_temperature_teacher epochs: a soft teacher early on is what
  # keeps the run from collapsing. This block previously read 0.04 -> 0.04 over
  # 301 epochs, i.e. the schedule was a no-op (start == end) AND its duration
  # exceeded the total epoch count of several datasets (fgvcaircraft runs 200).
  # 30 is the reference value and is shorter than our shortest schedule, so the
  # warmup always completes.
  temperature_teacher: 0.07
  warmup_temperature_teacher: 0.04
  warmup_epochs_temperature_teacher: 30

# Teacher EMA, cosine-scheduled from momentum_teacher -> final_momentum_teacher
# across training (DINO's m: 0.996 -> 1.0). A teacher that keeps moving at 0.996
# for all 400-1000 epochs never stabilises; annealing to 1.0 freezes it as the
# student converges. Driven by TeacherStudentCallback, registered in run.py.
momentum_teacher: 0.996
final_momentum_teacher: 1.0
center_momentum: 0.9  # DINO centering EMA; raise on small-batch/few-class datasets
sinkhorn_knopp: false  # use Sinkhorn-Knopp instead of subtractive centering (batch-size-invariant; DINOv2-style)


params:
  default:
    batch_size: 256
    max_epochs: 63
    # Micro-batch for multicrop -- see the note in lejepa.yaml. bs=128 at the
    # paper's 96px local crops peaks at 14.5GB on a 24GB card. 2 keeps the
    # effective batch at 256 so the LR and teacher-momentum schedules are
    # unchanged; DINO's centering is per-micro-batch too, so it benefits from
    # the larger sample for the same reason LeJEPA's SIGReg does.
    accumulate_grad_batches: 2
  # CIFAR-scale (32x32)
  cifar10:
    batch_size: 256
    max_epochs: 250
  cifar100:
    batch_size: 256
    max_epochs: 250
  svhn:
    batch_size: 256
    max_epochs: 188
  # Grayscale 28x28
  fashionmnist:
    batch_size: 256
    max_epochs: 188
  emnist:
    batch_size: 256
    max_epochs: 188
  kmnist:
    batch_size: 256
    max_epochs: 188
  notmnist:
    batch_size: 256
    max_epochs: 250
  pneumoniamnist:
    batch_size: 256
    max_epochs: 250
  # Other small datasets — switch to Sinkhorn-Knopp centering. Subtractive
  # centering collapses on these because they have <30 classes and run at
  # bs=32/step (accum=8), causing high per-batch class collision and noisy
  # centers; SK is batch-size-invariant and avoids the failure mode.
  arabiccharacters:
    batch_size: 256
    max_epochs: 313
    accumulate_grad_batches: 1
    sinkhorn_knopp: true
  arabicdigits:
    batch_size: 256
    max_epochs: 313
    sinkhorn_knopp: true
  # Larger resolution
  stl10:
    batch_size: 256
    max_epochs: 188
  # Small fine-grained
  flowers102:
    batch_size: 256
    max_epochs: 375
  cub200:
    batch_size: 256
    max_epochs: 375
  dtd:
    batch_size: 256
    max_epochs: 375
  country211:
    batch_size: 256
    max_epochs: 250
  rockpaperscissor:
    batch_size: 256
    max_epochs: 375
  # Large datasets
  food101:
    batch_size: 256
    max_epochs: 125
  tinyimagenet:
    batch_size: 256
    max_epochs: 125
  imagenette:
    batch_size: 256
    accumulate_grad_batches: 2
    max_epochs: 188

  # ----- new datasets (auto-inserted, paper tier rule) -----
  # 1× ImageNet base
  imagenet100:
    batch_size: 256
    max_epochs: 63
  # Medium-simple — ×3
  emnist_byclass:
    batch_size: 256
    max_epochs: 189
  emnist_digits:
    batch_size: 256
    max_epochs: 189
    sinkhorn_knopp: true
  emnist_letters:
    batch_size: 256
    max_epochs: 189
  emnist_mnist:
    batch_size: 256
    max_epochs: 189
    sinkhorn_knopp: true
  hasyv2:
    batch_size: 256
    max_epochs: 189
  # Medium-hard — ×4
  awa2:
    batch_size: 256
    max_epochs: 252
  galaxy10:
    batch_size: 256
    max_epochs: 252
  bloodmnist:
    batch_size: 256
    max_epochs: 252
  breastmnist:
    batch_size: 256
    max_epochs: 252
  dermamnist:
    batch_size: 256
    max_epochs: 252
  octmnist:
    batch_size: 256
    max_epochs: 252
  organamnist:
    batch_size: 256
    max_epochs: 252
  organcmnist:
    batch_size: 256
    max_epochs: 252
  organsmnist:
    batch_size: 256
    max_epochs: 252
  pathmnist:
    batch_size: 256
    max_epochs: 252
  retinamnist:
    batch_size: 256
    max_epochs: 252
  tissuemnist:
    batch_size: 256
    max_epochs: 252
  # Fine-grained — ×6
  cars196:
    batch_size: 256
    max_epochs: 378
  fgvcaircraft_family:
    batch_size: 256
    max_epochs: 378
  fgvcaircraft_manufacturer:
    batch_size: 256
    max_epochs: 378

# Per-dataset backbone overrides: patch_size and img_size for datasets whose
# native resolution is too small for the default ViT/16 at 224×224.
# crop sizes in create_transforms are driven by img_size; the backbone is
# built with the matching patch_size so token count is sensible.
per_dataset_backbone:
  arabiccharacters:
    patch_size: 4   # 32/4 = 8×8 = 64 tokens at native resolution
    img_size: 32
  emnist:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28
  emnist_byclass:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28
  emnist_bymerge:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28
  emnist_letters:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28
  emnist_digits:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28
  emnist_mnist:
    patch_size: 4   # 28/4 = 7×7 = 49 tokens at native resolution
    img_size: 28

vit_optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  scheduler:
    type: LinearWarmupCosineAnnealing

resnet_optimizer:
  type: AdamW
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  scheduler:
    type: LinearWarmupCosineAnnealing
